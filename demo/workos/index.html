<!DOCTYPE html>
<html style="width: 100%;height: 100%">
<head>
     <script src="../../build/player/lottie_lottielab.js"></script>
</head>
<body style="background-color:#ccc; margin: 0px;height: 100%; font-family: sans-serif;font-size: 10px">

<div style="width:100%;height:100%;background-color:#333;" id="bodymovin"></div>

<script>

    var animData = {
        wrapper: document.getElementById('bodymovin'),
        loop: true,
        autoplay: true,
        path: 'WorkOS.json',
        renderer: 'svg'
    };
    var anim = bodymovin.loadAnimation(animData);
    window.setTimeout(() => {
        anim = bodymovin.loadAnimation(animData);
    }, 2000)
</script>
</body>
</html>
